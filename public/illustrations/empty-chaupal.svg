<svg xmlns="http://www.w3.org/2000/svg" width="200" height="160" viewBox="0 0 200 160" fill="none">
  <!-- Empty Chaupal — a notice board / chat with a leaf. -->
  <!-- Board frame -->
  <rect x="58" y="44" width="84" height="64" rx="6" fill="#ffffff" stroke="#6b7b4f" stroke-width="2"/>
  <!-- Pin -->
  <circle cx="100" cy="40" r="3.5" fill="#c97b4a"/>
  <!-- Lines on board -->
  <path d="M70 62 L116 62" stroke="#6b7b4f" stroke-width="1.8" stroke-opacity="0.35" stroke-linecap="round"/>
  <path d="M70 74 L106 74" stroke="#6b7b4f" stroke-width="1.8" stroke-opacity="0.25" stroke-linecap="round"/>
  <path d="M70 86 L120 86" stroke="#6b7b4f" stroke-width="1.8" stroke-opacity="0.25" stroke-linecap="round"/>
  <!-- Leaf accent -->
  <path d="M122 90 C130 86 138 88 140 96 C132 100 124 98 122 90 Z" fill="#9aae74"/>
  <path d="M124 92 L138 95" stroke="#3d5a3a" stroke-width="1" stroke-opacity="0.5"/>
  <!-- Small posts/stand -->
  <path d="M86 108 L82 124" stroke="#6b7b4f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M114 108 L118 124" stroke="#6b7b4f" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Ground -->
  <path d="M62 126 C80 124 120 124 138 126" stroke="#c9a24b" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.5"/>
</svg>
