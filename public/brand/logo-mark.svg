<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Krishi Khata — Refined Earth logo mark.
       A minimal sprout emerging from soil within a soft circle.
       Palette: muted olive #6b7b4f, dusty gold #c9a24b, terracotta #c97b4a. -->
  <defs>
    <linearGradient id="soilGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b7b4f"/>
      <stop offset="1" stop-color="#3d5a3a"/>
    </linearGradient>
  </defs>
  <!-- Soft circle background -->
  <circle cx="24" cy="24" r="23" fill="#eef1e8"/>
  <circle cx="24" cy="24" r="23" fill="none" stroke="#6b7b4f" stroke-opacity="0.15" stroke-width="1"/>
  <!-- Central stem -->
  <path d="M24 34 L24 22" stroke="url(#soilGrad)" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Left leaf -->
  <path d="M24 25 C19 25 16 21 16 17 C20 17 23 20 24 25 Z" fill="url(#soilGrad)"/>
  <!-- Right leaf -->
  <path d="M24 23 C28 23 31 20 31 16 C27.5 16 25 18.5 24 23 Z" fill="#c9a24b"/>
  <!-- Seed/top bud -->
  <circle cx="24" cy="20" r="2.4" fill="#c97b4a"/>
  <!-- Soil line -->
  <path d="M13 35 C17 34 21 35 24 35 C27 35 31 34 35 35" stroke="#6b7b4f" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.55"/>
  <path d="M16 38 C19 37.4 22 38 24 38 C26 38 29 37.4 32 38" stroke="#c9a24b" stroke-width="1.3" stroke-linecap="round" stroke-opacity="0.5"/>
</svg>
